name: Deploy CouponDepots to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily rebuild (6:17 AM US Eastern) so expired codes drop off and dates stay fresh,
  # even on days with no new promo emails. Help: https://docs.github.com/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#schedule
  schedule:
    - cron: "17 11 * * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch merchant images (first run only, then cached in repo)
        run: |
          pip install --quiet pillow markdown
          unzip -o -q source.zip images.json fetch_images.py
          # Add images for brands that arrived through promos.json (email-to-site pipeline).
          python3 - <<'PY'
          import json, os
          imgs = json.load(open("images.json"))
          have = {d["name"] for d in imgs}
          promos = json.load(open("promos.json")) if os.path.exists("promos.json") else {}
          for b in promos.get("brands", []):
              im = b.get("image") or {}
              if im.get("src") and b["slug"] not in have and not b.get("blocked"):
                  imgs.append({"name": b["slug"], "src": im["src"].split("?")[0], "w": int(im.get("w", 1600)),
                               "h": int(im.get("h", 900)), "pos": im.get("pos", "50% 50%"), "alt": im.get("alt", b["name"])})
          json.dump(imgs, open("images.json", "w"), indent=2)
          PY
          python fetch_images.py || echo "Some images failed; those brands use the merchant's image URL until the next run"
      - name: Save images to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add img
          git diff --cached --quiet || (git commit -m "Add optimized merchant images" && git push)
      - name: Build site from source (build.py + promos.json)
        # The site is generated on every deploy, so new codes in promos.json go live
        # and expired ones drop off. site.zip is kept only as a manual fallback.
        run: |
          rm -rf _build _site && mkdir -p _build
          unzip -q source.zip -d _build
          cp promos.json _build/promos.json 2>/dev/null || true
          IMG_DIR="$PWD/img" ARTICLES_JSON="$PWD/articles/posts.json" python3 _build/build.py
          mv _build/site _site
          cp -r img _site/img
          # Daily blog bot posts (seo-controller) live in articles/ beside the zip.
          if [ -d articles ]; then cp -r articles _site/articles; fi
          # Blog hero photos (articles link to /images/blog/...).
          if [ -d images ]; then cp -r images _site/images; fi
          # Author page the post bylines link to (/author/shaheen-arif/).
          if [ -d author ]; then cp -r author _site/author; fi
          ls _site _site/img
      - name: Add blog bot posts to sitemap.xml
        # sitemap.xml is frozen inside site.zip, so new articles/ posts (and the
        # author page) are appended here on every deploy. Help:
        # https://developers.google.com/search/docs/crawling-indexing/sitemaps/build-sitemap
        run: |
          python3 - <<'PY'
          import pathlib, datetime, xml.etree.ElementTree as ET
          ns = "http://www.sitemaps.org/schemas/sitemap/0.9"
          ET.register_namespace("", ns)
          site = pathlib.Path("_site")
          path = site / "sitemap.xml"
          tree = ET.parse(path)
          root = tree.getroot()
          have = {u.findtext(f"{{{ns}}}loc", "").strip() for u in root.findall(f"{{{ns}}}url")}
          added = 0
          for d in ("articles", "author"):
              for f in sorted((site / d).rglob("*.html")) if (site / d).is_dir() else []:
                  rel = f.relative_to(site).as_posix()
                  url = "https://coupondepots.info/" + (rel[:-len("index.html")] if rel.endswith("index.html") else rel)
                  if url in have:
                      continue
                  day = datetime.date.fromtimestamp(f.stat().st_mtime).isoformat()
                  u = ET.SubElement(root, f"{{{ns}}}url")
                  ET.SubElement(u, f"{{{ns}}}loc").text = url
                  ET.SubElement(u, f"{{{ns}}}lastmod").text = day
                  ET.SubElement(u, f"{{{ns}}}priority").text = "0.8" if rel.endswith("index.html") else "0.7"
                  have.add(url); added += 1
          ET.indent(tree)
          tree.write(path, encoding="utf-8", xml_declaration=True)
          print(f"sitemap: added {added} URL(s), {len(have)} total")
          PY
      - name: Add blog bot posts to llms.txt
        # llms.txt is frozen inside site.zip too, so the daily guides in
        # articles/posts.json are added here on every deploy. Help: https://llmstxt.org/
        run: |
          python3 - <<'PY'
          import json, pathlib, datetime
          site = pathlib.Path("_site")
          llms, manifest = site / "llms.txt", site / "articles" / "posts.json"
          if not (llms.exists() and manifest.exists()):
              raise SystemExit("llms.txt or articles/posts.json missing; skipped")
          text = llms.read_text(encoding="utf-8")
          posts = sorted(json.loads(manifest.read_text(encoding="utf-8")), key=lambda p: p.get("date", ""), reverse=True)
          lines = ["## Daily buying guides", "- [All guides](https://coupondepots.info/articles/)"]
          for p in posts:
              if p.get("file") and p.get("title"):
                  lines.append(f"- [{p['title']}](https://coupondepots.info/articles/{p['file']}): {p.get('description', '').strip()}")
          section = "\n".join(lines) + "\n\n"
          marker = "## About and policies"
          text = text.replace(marker, section + marker, 1) if marker in text else text.rstrip() + "\n\n" + section
          today = datetime.date.today().isoformat()
          text = __import__("re").sub(r"Last updated: \d{4}-\d{2}-\d{2}", f"Last updated: {today}", text, count=1)
          llms.write_text(text, encoding="utf-8")
          print(f"llms.txt: added {len(lines) - 2} daily guide(s)")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Ping IndexNow (Bing, Yandex and others) with every page
        # Tells search engines the pages changed so they recrawl quickly. Help: https://www.indexnow.org/documentation
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          key = "c7d3e9a14b6f42d8a0e5b1f9c2d4a6e8"
          urls = re.findall(r"<loc>([^<]+)</loc>", open("_site/sitemap.xml").read())
          body = json.dumps({"host": "coupondepots.info", "key": key,
                             "keyLocation": f"https://coupondepots.info/{key}.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          print("IndexNow:", urllib.request.urlopen(req, timeout=30).status, len(urls), "URLs")
          PY
